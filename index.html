  <style>
    /* ================= 鍏ㄥ眬涓庡竷灞€ ================= */
    :root {
      --primary: #2563EB;        /* 涓昏壊 */
      --primary-dark: #1D4ED8;
      --primary-light: #EFF6FF;  /* 涓昏壊娴呭簳 */
      --green: #16A34A;          /* 姝ｇ‘ */
      --green-bg: #F0FDF4;
      --red: #DC2626;            /* 閿欒 */
      --red-bg: #FEF2F2;
      --text: #0F172A;
      --muted: #64748B;          /* 娆¤鏂囧瓧 */
      --line: #E2E8F0;           /* 鍒嗛殧绾?杈规 */
      --bg: #F1F5F9;             /* 椤甸潰搴曡壊 */
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #DBEAFE; /* 妗岄潰绔ぇ灞忔椂闇插嚭鐨勫簳鑹?*/
      color: var(--text);
      font-size: 15px;
      line-height: 1.65;
    }
    /* 绉诲姩绔紭鍏堬細鍐呭鍒楁渶澶?480px 灞呬腑锛屾闈㈢鍚屾牱姝ｅ父鏄剧ず */
    #wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      box-shadow: 0 0 24px rgba(15, 23, 42, .12);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .view { padding: 14px 14px 40px; }
    .muted { color: var(--muted); font-size: 14px; }

    /* ================= 棣栭〉 ================= */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(150deg, #3B82F6 0%, #2563EB 45%, #1E3A8A 100%);
      color: #fff;
      padding: 32px 20px 44px;
      text-align: center;
    }
    .hero::before, .hero::after {
      content: ''; position: absolute; border-radius: 50%;
      background: rgba(255, 255, 255, .10); pointer-events: none;
    }
    .hero::before { width: 180px; height: 180px; top: -70px; right: -50px; }
    .hero::after { width: 120px; height: 120px; bottom: -46px; left: -30px; background: rgba(255, 255, 255, .07); }
    .hero-title { font-size: 25px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0, 0, 0, .18); }
    .hero-sub { margin-top: 6px; font-size: 13px; opacity: .9; }
    .hero-chip {
      display: inline-block; margin-top: 10px; padding: 3px 12px;
      background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 999px; font-size: 12px; letter-spacing: .5px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .06);
    }
    /* 缁熻鍗′笂鎻愶紝鍘嬩綇澶村浘褰㈡垚灞傛 */
    .card.stat-card { position: relative; z-index: 2; margin-top: -30px; box-shadow: 0 6px 20px rgba(30, 58, 138, .12); }
    .card.daily { position: relative; overflow: hidden; }
    .card.daily::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg, #F59E0B, #F97316); border-radius: 4px 0 0 4px;
    }
    .stat-row { display: flex; text-align: center; }
    .stat-row + .stat-row { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .stat { flex: 1; }
    .stat b { display: block; font-size: 23px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--muted); }
    .entries { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 14px 0; }
    .tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--card); border-radius: 18px; padding: 18px 8px 14px;
      text-decoration: none; color: var(--text);
      border: 1px solid rgba(226, 232, 240, .7);
      box-shadow: 0 2px 6px rgba(15, 23, 42, .05);
      transition: transform .12s, box-shadow .12s;
    }
    .tile:active { transform: scale(.96); box-shadow: 0 1px 3px rgba(15, 23, 42, .08); }
    .tile-ico {
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; border-radius: 14px; font-size: 24px;
      background: var(--primary-light);
    }
    /* 姣忎釜鍏ュ彛涓€涓笓灞炶壊 */
    .entries .tile:nth-child(1) .tile-ico { background: #EFF6FF; }
    .entries .tile:nth-child(2) .tile-ico { background: #F5F3FF; }
    .entries .tile:nth-child(3) .tile-ico { background: #F0FDF4; }
    .entries .tile:nth-child(4) .tile-ico { background: #FFFBEB; }
    .entries .tile:nth-child(5) .tile-ico { background: #FEF2F2; }
    .entries .tile:nth-child(6) .tile-ico { background: #F0F9FF; }
    .tile-name { margin-top: 8px; font-size: 14px; font-weight: 700; }
    .tile-desc { margin-top: 2px; font-size: 11px; color: var(--muted); }
    .badge {
      position: absolute; top: 8px; right: 10px;
      background: var(--red); color: #fff; font-size: 11px; font-style: normal; font-weight: 700;
      min-width: 18px; height: 18px; border-radius: 9px; line-height: 18px;
      text-align: center; padding: 0 4px;
      box-shadow: 0 2px 6px rgba(220, 38, 38, .35);
    }
    .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin: 22px 0 28px; }

    /* ================= 椤舵爮 ================= */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      background: var(--primary); color: #fff; padding: 12px 14px;
    }
    .topbar .back { color: #fff; text-decoration: none; font-size: 15px; padding: 4px 8px 4px 0; white-space: nowrap; }
    .topbar-title { flex: 1; text-align: center; font-weight: 600; font-size: 17px; }
    .topbar-side { width: 30px; }
    .star { background: transparent; border: none; color: #fff; font-size: 22px; line-height: 1; padding: 4px; cursor: pointer; }
    .star.on { color: #FACC15; }
    .clock {
      background: rgba(255, 255, 255, .2); border-radius: 999px; padding: 3px 12px;
      font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .clock.danger { background: var(--red); }

    /* ================= 鎸夐挳 ================= */
    .btn {
      display: inline-block; border: none; border-radius: 12px;
      padding: 12px 18px; font-size: 16px; font-weight: 600;
      cursor: pointer; text-align: center; text-decoration: none;
      transition: opacity .15s, transform .1s; min-height: 44px; /* 瑙︽帶鍙嬪ソ */
    }
    .btn:active { opacity: .85; transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-ghost { background: var(--card); color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-ghost-red { background: var(--card); color: var(--red); border: 1.5px solid var(--red); }
    .btn-block { display: block; width: 100%; }

    /* ================= 鍒烽 ================= */
    .progress-wrap { display: flex; align-items: center; gap: 10px; margin: 12px 14px 0; }
    .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .2s; }
    .progress-text { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .q-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 999px; padding: 2px 10px; }
    .chip-blue { color: var(--primary); background: var(--primary-light); font-weight: 600; }
    .q-stem { font-size: 16px; font-weight: 600; margin-bottom: 14px; word-break: break-word; }
    .opt {
      display: flex; align-items: flex-start;
      border: 1.5px solid var(--line); border-radius: 12px;
      padding: 11px 12px; margin-bottom: 10px;
      background: var(--card); font-size: 15px; cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
    }
    .opt:active { transform: scale(.99); }
    .opt .letter {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: var(--bg); color: var(--muted);
      font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin-right: 10px; margin-top: 1px;
    }
    .opt-text { flex: 1; word-break: break-word; }
    .opt.picked { border-color: var(--primary); background: var(--primary-light); }
    .opt.picked .letter { background: var(--primary); color: #fff; }
    .opt.correct { border-color: var(--green); background: var(--green-bg); }
    .opt.correct .letter { background: var(--green); color: #fff; }
    .opt.wrong { border-color: var(--red); background: var(--red-bg); }
    .opt.wrong .letter { background: var(--red); color: #fff; }
    .opt.disabled { cursor: default; }
    .judge-strip { border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; margin-top: 4px; }
    .judge-strip.ok { background: var(--green-bg); color: var(--green); border: 1px solid #BBF7D0; }
    .judge-strip.no { background: var(--red-bg); color: var(--red); border: 1px solid #FECACA; }
    .judge-strip small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; font-size: 13px; }
    .exp-box { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px 14px; margin-top: 8px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
    .navbtns { display: flex; gap: 12px; margin: 14px; }
    .navbtns .btn { flex: 1; }
    .exam-foot { margin: 0 14px 20px; }
    .exam-foot p { margin-bottom: 10px; }

    /* ================= 鍒楄〃锛堥敊棰樻湰/鏀惰棌/閿欓鍥為【锛?================= */
    .bk-item {
      background: var(--card); border-radius: 14px; padding: 14px;
      margin: 0 14px 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
    }
    .bk-stem { font-size: 14px; font-weight: 600; margin: 8px 0; word-break: break-word; }
    .bk-ans { font-size: 13px; color: var(--green); font-weight: 600; }
    .rv-line { font-size: 13px; margin-top: 4px; }
    .rv-line.bad { color: var(--red); }
    .rv-line.good { color: var(--green); }
    .bk-actions { display: flex; gap: 10px; margin-top: 10px; }
    .bk-actions .btn { flex: 1; padding: 9px 0; font-size: 14px; border-radius: 10px; min-height: 38px; }
    .sec-title { margin: 18px 16px 12px; font-size: 16px; }

    /* ================= 妯℃嫙鑰冭瘎鍒?================= */
    .score-circle {
      width: 120px; height: 120px; border-radius: 50%;
      border: 6px solid var(--primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 16px auto 18px;
    }
    .score-circle b { font-size: 40px; color: var(--primary); line-height: 1.1; }
    .score-circle span { font-size: 13px; color: var(--muted); }

    /* ================= 绌虹姸鎬?================= */
    .empty { text-align: center; color: var(--muted); padding: 56px 20px; }
    .empty .big { font-size: 44px; margin-bottom: 10px; }
    .empty p { margin-bottom: 4px; }
    .daily-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:#4B5563}
    .daily-streak{color:#EA580C;font-weight:600}
    .daily-stem{font-weight:600;margin-bottom:10px;line-height:1.5}
    .daily-result{margin-top:4px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600}
    .daily-result.ok{background:#EAF9EF;color:#15803D}
    .daily-result.bad{background:#FDEBEB;color:#B91C1C}
  
    /* ---------- 涓汉涓婚〉 ---------- */
    .hero { position: relative; }
    .hero-me {
      position: absolute; top: 14px; right: 14px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.18); border-radius: 999px;
      padding: 3px 12px 3px 4px; color: #fff; text-decoration: none;
    }
    .hero-me-emoji {
      width: 26px; height: 26px; background: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .hero-me-nick { font-size: 12px; font-weight: 600; }
    .me-card { display: flex; align-items: center; gap: 14px; }
    .me-avatar {
      width: 56px; height: 56px; border-radius: 50%; flex: none;
      background: #EFF6FF; display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    .me-info { flex: 1; min-width: 0; }
    .me-nick-input {
      width: 100%; border: none; outline: none; background: transparent;
      font-size: 18px; font-weight: 700; color: var(--ink);
      border-bottom: 1.5px dashed #CBD5E1; padding: 2px 0 4px;
    }
    .me-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .me-sec-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--ink); }
    .me-lit { font-size: 11px; color: var(--muted); font-weight: 500; }
    .avatar-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .avatar-opt {
      width: 42px; height: 42px; border-radius: 50%; font-size: 20px;
      border: 2px solid transparent; background: #F1F5F9; cursor: pointer;
    }
    .avatar-opt.on { border-color: #2563EB; background: #EFF6FF; }
    .me-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .me-stat { text-align: center; background: #F8FAFC; border-radius: 12px; padding: 12px 4px; }
    .me-stat b { display: block; font-size: 18px; color: #2563EB; }
    .me-stat span { font-size: 11px; color: var(--muted); }
    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge {
      text-align: center; background: #F8FAFC; border-radius: 12px;
      padding: 12px 4px; opacity: .4;
    }
    .badge.on { opacity: 1; background: #FFF7E6; box-shadow: 0 2px 8px rgba(245,158,11,.15); }
    .badge-ico { font-size: 24px; }
    .badge-name { font-size: 12px; font-weight: 700; margin-top: 4px; }
    .badge-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-cell { aspect-ratio: 1; border-radius: 4px; background: #F1F5F9; }
    .cal-cell.lv1 { background: #BFDBFE; }
    .cal-cell.lv2 { background: #60A5FA; }
    .cal-cell.lv3 { background: #2563EB; }
    .cal-legend { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .me-btn {
      width: 100%; padding: 12px; border-radius: 10px; margin-top: 8px;
      border: 1.5px solid #E2E8F0; background: #fff; font-size: 14px;
      color: var(--ink); cursor: pointer;
    }
    .me-btn:active { transform: scale(.98); }
    .me-btn.primary { background: #2563EB; border-color: #2563EB; color: #fff; font-weight: 600; }
    .me-btn.danger { color: #DC2626; border-color: #FECACA; }
    .auth-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .me-input {
      flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px;
      border: 1.5px solid #E2E8F0; font-size: 14px; outline: none;
    }
    .me-input:focus { border-color: #2563EB; }
    .cloud-note {
      font-size: 12.5px; color: var(--muted); line-height: 1.8;
      background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px 12px;
    }
    .me-tip { font-size: 12px; color: #DC2626; margin-top: 8px; min-height: 14px; }
    .me-foot { font-size: 11px; color: var(--muted); text-align: center; margin: 4px 0 20px; }
    /* ---------- 搴曢儴瀵艰埅鏍?---------- */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      display: flex; background: #fff;
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar a {
      flex: 1; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 0 6px; text-decoration: none;
      color: var(--muted); font-size: 10.5px;
    }
    .tabbar .t-ico { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .55; }
    .tabbar a.on { color: var(--brand); font-weight: 600; }
    .tabbar a.on .t-ico { filter: none; opacity: 1; }
    .tabbar.off { display: none; }
    .tab-badge {
      position: absolute; top: 3px; right: calc(50% - 24px);
      min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
      background: #EF4444; color: #fff; font-size: 10px; font-style: normal;
      font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    body.tabbed .view { padding-bottom: 96px; }

    /* ---------- 娓告垙鍖栵細XP / 绛夌骇 / 浠诲姟 / 杩炲嚮 / 缁撶畻 / 寮辩偣 ---------- */
    .lvl-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .lvl-chip {
      background: rgba(255,255,255,.95); color: var(--brand);
      font-size: 11px; font-weight: 800; border-radius: 10px; padding: 2px 8px;
    }
    .lvl-bar {
      flex: 1; height: 8px; border-radius: 4px;
      background: rgba(255,255,255,.25); overflow: hidden;
    }
    .lvl-bar i { display: block; height: 100%; background: #FDE047; border-radius: 4px; transition: width .3s; }
    .lvl-num { font-size: 10.5px; color: rgba(255,255,255,.9); white-space: nowrap; }
    .card .lvl-bar { background: var(--line); }
    .card .lvl-chip { background: var(--brand); color: #fff; }
    .card .lvl-num { color: var(--muted); }
    .sec-inline { font-size: 13.5px; font-weight: 800; margin-bottom: 10px; color: var(--ink); }

      padding: 8px 4px; border-bottom: 1px dashed var(--line); font-size: 13px;
    }
    .task-row:last-child { border-bottom: none; }
    .task-row.done .task-name, .task-row.done .task-prog { color: var(--muted); text-decoration: line-through; }
    .task-ico { font-size: 16px; }
    .task-name { flex: 1; font-weight: 600; }
    .task-prog { font-size: 12px; color: var(--muted); }
    .task-xp {
      font-size: 11px; font-weight: 800; color: #B45309;
      background: #FEF3C7; border-radius: 8px; padding: 2px 7px;
    }
    .task-row.done .task-xp { background: #DCFCE7; color: #15803D; }
    .combo-chip { color: #EA580C; }
    .xp-chip { color: #B45309; }
    .judge-strip { position: relative; }

    /* 瀹犵墿浜掑姩锛氭搷浣滄寜閽?/ 鐖卞績绮掑瓙 / 鎽囨憜绗?*/

    /* ---------- 鏂版墜寮曞閬僵 ---------- */

    /* ============ Duolingo 瑙嗚璇█瑕嗙洊灞?============
       缁跨郴涓昏壊 / 鍘氱伆鎻忚竟鍗＄墖 / 3D搴曡竟鎸夐挳 / 鍦嗚儢瀛?/ 鍒ゅ畾绾㈢豢 */
    :root {

<body>
  <!-- 鍗曢〉搴旂敤鎸傝浇鐐癸細鎵€鏈夎鍥剧敱 JS 娓叉煋杩?#app -->
  <div id="wrap"><div id="app"></div></div>
  <!-- 瀹犵墿浼欎即銆屽皬椋炪€嶏細鎯呯华浠峰€?+ 鎯呭鎻愰啋锛堝浐瀹氬彸涓嬭锛岄殢瑙嗗浘鏄鹃殣锛?-->
  <div id="pet" class="pet off" data-act="pet">
    <div class="pet-bubble" id="petBubble"></div>
    <div class="pet-body">馃殎</div>
  </div>

  <!-- 搴曢儴瀵艰埅鏍忥細棣栭〉 / 閿欓鏈?/ 鎴戠殑锛堝埛棰樹笌鑰冭瘯椤佃嚜鍔ㄩ殣钘忥級 -->
  <nav class="tabbar off" id="tabbar">

    <a href="#/wrong" data-t="wrong"><span class="t-ico">馃摃</span><span>閿欓鏈?/span><i class="tab-badge" id="tabWrongBadge" style="display:none">0</i></a>
    <a href="#/me" data-t="me"><span class="t-ico">馃懁</span><span>鎴戠殑</span></a>
  </nav>

  <!-- 棰樺簱鏁版嵁锛堢函闈欐€併€佺绾匡紱鍐呭涓庢簮 h5_data.js 瀹屽叏涓€鑷达級 -->
  <script src="data.js"></script>

  <script src="cloud-config.js"></script>
  <!-- 搴旂敤閫昏緫 -->
  <script>
  (function () {
    'use strict';

    /* =====================================================================
     * 涓€銆佸父閲忎笌鏈湴瀛樺偍灞?     * ===================================================================== */

    // localStorage 閿悕锛氬涔犺繘搴?/ 閿欓 / 鏀惰棌
    var KEY_PROGRESS = 'wrh5_progress';
    var KEY_WRONG    = 'wrh5_wrong';
    var KEY_FAV      = 'wrh5_fav';

    // 妯℃嫙鑰冭瘯鍙傛暟锛氶殢鏈?30 閬撳崟閫夐锛岄檺鏃?20 鍒嗛挓
    var EXAM_COUNT   = 30;
    var EXAM_SECONDS = 20 * 60;

    // 閫夐」瀛楁瘝椤哄簭
    var LETTERS = ['A', 'B', 'C', 'D'];

    /** 瀹夊叏璇诲彇 JSON锛氶敭涓嶅瓨鍦ㄦ垨瑙ｆ瀽澶辫触鏃惰繑鍥為粯璁ゅ€?*/
    function lsGet(key, def) {
      try {
        var raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return def;
        var val = JSON.parse(raw);
        return (val === null || val === undefined) ? def : val;
      } catch (e) { return def; }
    }
    /** 鍐欏叆 JSON锛堝け璐ラ潤榛樺鐞嗭紝渚嬪娴忚鍣ㄩ殣绉佹ā寮忓啓鍏ュ彈闄愶級 */
    function lsSet(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }

    // 搴旂敤鐘舵€侊紙鍐呭瓨缂撳瓨锛屾瘡娆″彉鏇村悗绔嬪嵆鍐欏洖 localStorage锛?    var progress = lsGet(KEY_PROGRESS, { doneId: [], correct: 0, total: 0 });
    if (!Array.isArray(progress.doneId)) progress.doneId = [];
    if (typeof progress.correct !== 'number') progress.correct = 0;
    if (typeof progress.total  !== 'number') progress.total  = 0;
    var wrongIds = lsGet(KEY_WRONG, []); // 绛旈敊棰樼洰鐨?id 鍒楄〃
    var favIds   = lsGet(KEY_FAV, []);   // 鏀惰棌棰樼洰鐨?id 鍒楄〃
    if (!Array.isArray(wrongIds)) wrongIds = [];
    if (!Array.isArray(favIds))   favIds   = [];

    function saveProgress() { lsSet(KEY_PROGRESS, progress); }
    function saveWrong()    { lsSet(KEY_WRONG, wrongIds); }
    function saveFav()      { lsSet(KEY_FAV, favIds); }

    /* =====================================================================
     * 浜屄蜂簲 娓告垙鍖栨牳蹇冿細XP缁忛獙 / 绛夌骇 / 姣忔棩浠诲姟 / 鏄撻敊鐐规帉鎻″害
     * ===================================================================== */

    var KEY_XP      = 'wrh5_xp';       // 缁忛獙鍊兼€婚噺
    var KEY_TASKS   = 'wrh5_tasks';    // 姣忔棩浠诲姟 {date,answers,corrects,maxCombo,awarded:{a1,a2,a3}}
    var KEY_MASTERY = 'wrh5_mastery';  // 鎺屾彙搴?{qid:{w:閿欐,r:瀵规,s:杩炲}}锛岃繛瀵?娆?宸叉帉鎻?    var KEY_GAME    = 'wrh5_game';     // 娓告垙鍖栨。妗?{bestCombo:鍘嗗彶鏈€楂樿繛瀵?levels:宸插畬鎴愬叧鍗℃暟}

    var xp     = lsGet(KEY_XP, 0);
    var tasks  = lsGet(KEY_TASKS, null);
    var mastery = lsGet(KEY_MASTERY, {});
    var game   = lsGet(KEY_GAME, { bestCombo: 0, levels: 0 });
    if (typeof xp !== 'number' || xp < 0) xp = 0;
    if (!tasks || typeof tasks !== 'object') tasks = { date: '', answers: 0, corrects: 0, maxCombo: 0, awarded: {} };
    if (!tasks.awarded) tasks.awarded = {};
    if (!mastery || typeof mastery !== 'object') mastery = {};
    if (!game || typeof game !== 'object') game = { bestCombo: 0, levels: 0 };

    // 褰撳墠浼氳瘽杩炲鏁帮紙鐢卞埛棰樺垽瀹氬缁存姢锛宺ecordAnswer 鍐呰鍙栬鍏ユ瘡鏃ヤ换鍔★級
    var comboNow = 0;

    /** 绛夌骇淇℃伅锛氭瘡 100 XP 鍗?1 绾?*/
    function levelInfo() {
      return { lv: Math.floor(xp / 100) + 1, cur: xp % 100, need: 100 };
    }
    function addXp(n) {
      if (n <= 0) return;
      xp += n;
      lsSet(KEY_XP, xp);
    }

    /** 姣忔棩浠诲姟鎺ㄨ繘 + 鑷姩鍙戝锛堣法澶╄嚜鍔ㄩ噸缃級 */
    function bumpTasks(right) {
      var today = todayStr();
      if (tasks.date !== today) {
        tasks = { date: today, answers: 0, corrects: 0, maxCombo: 0, awarded: {} };
      }
      tasks.answers++;
      if (right) tasks.corrects++;
      if (comboNow > tasks.maxCombo) tasks.maxCombo = comboNow;
      // 涓変釜浠诲姟杈炬爣鑷姩鍙?XP锛堜竴娆★級
      if (!tasks.awarded.a1 && tasks.answers >= 10) { tasks.awarded.a1 = 1; addXp(20); }
      if (!tasks.awarded.a2 && tasks.corrects >= 8) { tasks.awarded.a2 = 1; addXp(20); }
      if (!tasks.awarded.a3 && tasks.maxCombo >= 5) { tasks.awarded.a3 = 1; addXp(30); }
      lsSet(KEY_TASKS, tasks);
    }

    /** 鎺屾彙搴︽帹杩涳細绛旈敊 s 娓呴浂锛涜繛瀵?2 娆¤涓?宸叉帉鎻?锛堟槗閿欑偣鐗硅瀹屾垚鏍囧噯锛?*/
    function bumpMastery(q, right) {
      var m = mastery[q.id] || { w: 0, r: 0, s: 0 };
      if (right) { m.r++; m.s++; } else { m.w++; m.s = 0; }
      mastery[q.id] = m;
      lsSet(KEY_MASTERY, mastery);
    }
    function isMastered(qid) {
      var m = mastery[qid];
      return !!(m && m.s >= 2);
    }
    function masteredCount() {
      return Object.keys(mastery).filter(isMastered).length;
    }

    /** 寮辩偣鐢诲儚锛氭寜鍒嗙被缁熻閿欓鍗犳瘮锛岃繑鍥為敊璇渶澶氱殑鍒嗙被锛堚墺2 閿欐墠璁″叆锛?*/
    function weakCats() {
      var byCat = {};
      function addWrong(cat) { if (!byCat[cat]) byCat[cat] = 0; byCat[cat]++; }
      wrongIds.forEach(function (id) {
        var q = qById[id];
        if (q) addWrong(q.cat || '鏈垎绫?);
      });
      Object.keys(mastery).forEach(function (id) {
        var m = mastery[id];
        // 鍘嗗彶閿?2 娆′互涓婁笖灏氭湭鎺屾彙鐨勶紝涔熻鍏ュ急鐐?        if (m.w >= 2 && !isMastered(Number(id))) {
          var q2 = qById[Number(id)];
          if (q2) addWrong(q2.cat || '鏈垎绫?);
        }
      });
      return Object.keys(byCat)
        .filter(function (c) { return byCat[c] >= 2; })
        .map(function (c) { return { cat: c, wrong: byCat[c] }; })
        .sort(function (a, b) { return b.wrong - a.wrong; })
        .slice(0, 4);
    }

    /**
     * 鏄撻敊鐐圭壒璁姹?= 鏈帉鎻＄殑閿欓 + 鍚屽垎绫荤殑鍏朵粬浣庢帉鎻″害棰橈紙寮哄寲鏄撻敊棰嗗煙锛?     */
    function weakPool() {
      var pool = [];
      var seen = {};
      wrongIds.forEach(function (id) {
        if (!isMastered(id) && qById[id]) { pool.push(qById[id]); seen[id] = 1; }
      });
      var cats = {};
      pool.forEach(function (q) { cats[q.cat || '鏈垎绫?] = 1; });
      Object.keys(cats).forEach(function (c) {
        var extra = QBANK.filter(function (q) {
          return (q.cat || '鏈垎绫?) === c && !seen[q.id];
        }).slice(0, 15);
        extra.forEach(function (q) { pool.push(q); seen[q.id] = 1; });
      });
      return shuffle(pool).slice(0, 40);
    }

    /* =====================================================================
     * 浜屻€侀搴撹緟鍔?     * ===================================================================== */

    // 杩囨护鎺変笉瀹屾暣鐨勬暟鎹紝淇濊瘉娓叉煋瀹夊叏
    var QBANK = (window.QUESTIONS || []).filter(function (q) {
      return q && typeof q.id === 'number' && q.stem && q.answer;
    });
    var qById = {};
    QBANK.forEach(function (q) { qById[q.id] = q; });

    /** Fisher-Yates 娲楃墝锛堣繑鍥炴柊鏁扮粍锛屼笉淇敼鍘熸暟缁勶級 */
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    /** HTML 杞箟锛岄槻姝㈤骞?閫夐」涓殑鐗规畩瀛楃鐮村潖椤甸潰缁撴瀯 */
    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function buildSession(mode) {
      var pool;
      if (mode === 'seq') {
        pool = QBANK.slice().sort(function (a, b) { return a.id - b.id; });

        pool = shuffle(QBANK);
      } else if (mode === 'multi') {
        pool = shuffle(QBANK.filter(function (q) { return q.type === 'multi'; }));
      } else if (mode === 'wrong') {
        pool = wrongIds.map(function (id) { return qById[id]; }).filter(Boolean);
      } else if (mode === 'weak') {
        pool = weakPool();

        pool = lvPool(getRank().lv).slice(); // 褰撳墠娈典綅棰樻睜锛氭寜闅惧害浠庝綆鍒伴珮
      } else { // fav

    function diffScore(q) {

    var SORTED_BANK = QBANK.slice().sort(function (a, b) {

      if (view !== 'exam' && view !== 'lvexam') { stopExamTimer(); exam = null; }
      window.scrollTo(0, 0);
      switch (view) {
        case '':
        case 'home':    renderHome(); break;
        case 'practice': renderPracticeRoute(parts[1] || 'seq'); break;
        case 'exam':    renderExamRoute(); break;
        case 'lvexam':  renderLvExamRoute(); break;
        case 'wrong':   renderBook(false); break;
        case 'fav':     renderBook(true); break;

        default:        renderHome();

    function syncTabbar(view) {
      var bar = document.getElementById('tabbar');
      if (!bar) return;
      var show = view === '' || view === 'home' || view === 'wrong' || view === 'fav' || view === 'me';
      bar.classList.toggle('off', !show);
      document.body.classList.toggle('tabbed', show);
      var active = (view === '' || view === 'home') ? 'home' : (view === 'wrong' ? 'wrong' : (view === 'me' ? 'me' : ''));
      var links = bar.querySelectorAll('a');
      for (var i = 0; i < links.length; i++) {
        links[i].classList.toggle('on', links[i].getAttribute('data-t') === active);
      }
      // 閿欓瑙掓爣
      var bd = document.getElementById('tabWrongBadge');
      if (bd) {
        var n = wrongIds.length;
        bd.style.display = n > 0 ? 'flex' : 'none';
        bd.textContent = n > 99 ? '99+' : n;
      }
    }

    /* ---------- 姣忔棩涓€棰?---------- */
    function todayStr() {
      var d = new Date();
      function p(n) { return (n < 10 ? '0' : '') + n; }
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function yesterdayStr() {
      var d = new Date(Date.now() - 86400000);
      function p(n) { return (n < 10 ? '0' : '') + n; }
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function dailyInfo() {
      var st;
      try { st = JSON.parse(localStorage.getItem('wrh5_daily') || '{}'); } catch (e) { st = {}; }
      if (!st.streak) st.streak = 0;
      return st;
    }
    function dailyQuestion() {
      var d = new Date();
      var seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
      var idx = seed % QBANK.length;
      while (QBANK[idx].type === 'multi') idx = (idx + 1) % QBANK.length;
      return QBANK[idx];
    }
    function dailyCardHTML() {
      var q = dailyQuestion();
      var st = dailyInfo();
      var doneToday = st.last === todayStr() && st.lastId === q.id;
      var h = '<div class="daily-head"><b>馃搮 姣忔棩涓€棰?路 ' + todayStr() + '</b>' +
        '<span class="daily-streak">馃敟 杩炵画鎵撳崱 ' + (st.streak || 0) + ' 澶?/span></div>' +
        '<div class="daily-stem">' + q.stem + '</div>';
      if (doneToday) {
        var right = st.lastPick === q.answer;
        h += '<div class="daily-result ' + (right ? 'ok' : 'bad') + '">' +
          (right ? '鉁?浠婃棩宸茬瓟瀵癸紝鏄庡ぉ鍐嶆潵锛? : '鉁?浠婃棩绛旈敊浜嗭紝姝ｇ‘绛旀 ' + q.answer) + '</div>';
        if (q.exp) h += '<div class="exp-box">馃挕 瑙ｆ瀽锛? + esc(q.exp) + '</div>';
      } else {
        h += ['A', 'B', 'C', 'D'].map(function (L) {
          return '<div class="opt" data-act="dopt" data-letter="' + L + '"><span class="letter">' + L + '</span><span class="opt-text">' + q[L] + '</span></div>';
        }).join('');
      }
      return h;
    }
    function dailyPick(letter) {
      var q = dailyQuestion();
      var st = dailyInfo();
      if (st.last === todayStr()) return; // 浠婃棩宸插畬鎴?      var right = letter === q.answer;
      comboNow = right ? 1 : 0; // 姣忔棩涓€棰樿鍏ユ瘡鏃ヤ换鍔★紙杩炲鎸?棰樿锛?      recordAnswer(q, right);             // 澶嶇敤鎬昏繘搴?閿欓鏈€昏緫
      comboNow = 0;
      st.streak = (st.last === yesterdayStr()) ? st.streak + 1 : 1;
      st.last = todayStr();
      st.lastId = q.id;
      st.lastPick = letter;
      localStorage.setItem('wrh5_daily', JSON.stringify(st));
      renderHome();
    }

    function tickExam() {
      if (!exam || !exam.started || exam.submitted) { stopExamTimer(); return; }
      var remain = Math.max(0, Math.ceil((exam.endAt - Date.now()) / 1000));
      var clock = document.getElementById('examClock');
      if (clock) {
        clock.textContent = '鈴?' + fmtTime(remain);
        clock.className = 'clock' + (remain <= 300 ? ' danger' : '');
      }
      if (remain <= 0) submitExam(true);
    }

    /** 浜ゅ嵎锛氳嚜鍔紙鍊掕鏃跺綊闆讹級鎴栨墜鍔紱璇勫垎骞舵妸閿欓骞跺叆閿欓鏈?*/
    function submitExam(auto) {
      if (!exam || !exam.started || exam.submitted) return;
      var un = exam.queue.filter(function (q) { return !exam.picks[q.id]; }).length;
      if (!auto && un > 0 && !window.confirm('杩樻湁 ' + un + ' 棰樻湭浣滅瓟锛岀‘瀹氳浜ゅ嵎鍚楋紵')) return;
      stopExamTimer();
      var remain = Math.max(0, Math.ceil((exam.endAt - Date.now()) / 1000));
      var correct = 0;
      var wrongDetail = [];
      exam.queue.forEach(function (q) {
        var pick = exam.picks[q.id] || '';
        var right = !!pick && pick === q.answer;
        if (right) correct++;
        else wrongDetail.push({ q: q, pick: pick || '鏈綔绛? });
        comboNow = right ? 1 : 0; // 鑰冭瘯鏃犺繛鍑绘蹇碉紝鎸夊崟棰樺閿欏悓姝ヤ换鍔＄粺璁?        recordAnswer(q, right); // 璁″叆杩涘害缁熻锛涢敊棰樺苟鍏ラ敊棰樻湰銆佺瓟瀵圭Щ鍑?      });
      comboNow = 0;
      exam.submitted = true;
      exam.result = {
        correct: correct,
        total: exam.queue.length,
        score: Math.round(correct * 100 / exam.queue.length), // 鐧惧垎鍒?        used: (exam.lv ? LV_EXAM_SECONDS : EXAM_SECONDS) - remain,
        wrong: wrongDetail
      };
      if (exam.lv) {
        // 鈥斺€?鏅嬬骇鍒ゅ畾锛氭纭巼 鈮?LV_PASS% 閫氳繃锛屾檵绾?+100XP 鈥斺€?        var rk = getRank();
        var pass = exam.result.score >= LV_PASS;
        exam.result.verdict = pass ? 'pass' : 'fail';
        exam.result.lvNo = rk.lv;
        if (pass) {
          rk.passed[rk.lv] = true;
          rk.lv = Math.min(LV_COUNT, rk.lv + 1);
          saveRank(rk);
          addXp(100);
          exam.result.newLv = rk.lv;
        }
      } else if (exam.result.score > lsGet(KEY_EXAMBEST, 0)) {
        lsSet(KEY_EXAMBEST, exam.result.score); // 涓汉涓婚〉路妯¤€冩渶浣筹紙鏅嬬骇鑰冭瘯涓嶈鍏ワ級
      }
      renderExamResult();
    }

    /* =====================================================================
     * 鍏€佷氦浜掑姩浣滐紙浜嬩欢濮旀墭锛氱粺涓€鍦?#app 涓婄洃鍚偣鍑伙級

    /** 鍒ゅ畾褰撳墠棰橈紙鍗曢€夌偣鍑诲嵆鍒?/ 澶氶€夌‘璁ゅ悗鍒わ級锛屽苟璁板綍杩涘害涓庨敊棰?*/
    function judge(q, picks) {
      var right = isRight(q, picks);
      session.judged[q.id] = { picks: picks.slice().sort().join(''), right: right };
      // 鈥斺€?杩炲嚮锛氱瓟瀵?+1锛岀瓟閿欐竻闆讹紱鍚屾鍘嗗彶鏈€楂樹笌姣忔棩浠诲姟 鈥斺€?      session.combo = right ? (session.combo || 0) + 1 : 0;
      if (session.combo > (session.maxCombo || 0)) session.maxCombo = session.combo;
      if (session.combo > (game.bestCombo || 0)) { game.bestCombo = session.combo; lsSet(KEY_GAME, game); }
      comboNow = session.combo;
      recordAnswer(q, right);
      session.xpGain = (session.xpGain || 0) + (right ? 10 : 0);
      comboNow = 0;
      renderPractice();
      // 鈥斺€?灏忛鎯呯华鍙嶅簲锛氱瓟閿欏畨鎱帮紝杩炲鍠濆僵 鈥斺€?      if (!right) {

        petPeek(petCheer[Math.floor(Math.random() * petCheer.length)], 4500);
      } else if (session.combo === 5) {
        petPeek('馃敟 杩炲 5 棰橈紒鎵嬫劅鐑捣鏉ヤ簡锛岀户缁啿锛?, 4500);
      } else if (session.combo === 10) {
        petPeek('馃帀 杩炲 10 棰橈紒浣犲氨鏄搴撻噷鐨勭帇鐗岄鎵嬶紒', 5000);
      }
    }

      switch (act) {

        case 'opt': { // 鐐瑰嚮閫夐」
          if (!session) return;
          var q = session.queue[session.idx];
          if (!q || session.judged[q.id]) return; // 宸插垽瀹氾紝涓嶅彲淇敼
          var letter = el.getAttribute('data-letter');
          if (q.type === 'single') {

            // 澶氶€夛細浠呭垏鎹㈠嬀閫夌姸鎬侊紝寰呯‘璁?            var picks = session.picks[q.id] || (session.picks[q.id] = []);
            var i = picks.indexOf(letter);

          if (pc.length) judge(qc, pc);
          break;
        }

            if (session.idx % 10 === 0 && session.idx < session.queue.length) {
              renderChunkDone(session.idx / 10);

          }

            var cno = Math.ceil(session.idx / 10);

          if (exam.picks[qe.id] === le) delete exam.picks[qe.id];

          function shareFallback() {

              navigator.clipboard.writeText(shareData.url).then(function () { petSay('閾炬帴宸插鍒讹紝鍘荤矘璐寸粰鏈嬪弸鍚?馃搵'); }, function () { petSay('澶嶅埗澶辫触锛岃鎵嬪姩澶嶅埗鍦板潃鏍忛摼鎺?); });
            } else { petSay('璇峰湪鍦板潃鏍忓鍒堕摼鎺ュ垎浜粰鏈嬪弸'); }
          }
          if (navigator.share) {

    var KEY_TUTORIAL = 'wrh5_tutorial';
